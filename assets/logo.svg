<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="G-Box Freeze Dried Candy">
  <!-- Circle background -->
  <circle cx="110" cy="110" r="108" fill="#217a1e"/>

  <!-- G-BOX — large, bold, rotated ~-12deg -->
  <g transform="rotate(-12, 110, 88)">
    <text x="110" y="92"
      font-family="'Impact','Arial Black','Franklin Gothic Heavy',sans-serif"
      font-size="66" font-weight="900"
      fill="white" text-anchor="middle"
      letter-spacing="-2">G-BOX</text>
  </g>

  <!-- Two diagonal slash lines -->
  <line x1="14"  y1="126" x2="206" y2="108" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="14"  y1="135" x2="206" y2="117" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- FREEZE DRIED CANDY — bold, rotated -->
  <g transform="rotate(-12, 110, 156)">
    <text x="112" y="158"
      font-family="'Impact','Arial Black','Franklin Gothic Heavy',sans-serif"
      font-size="20" font-weight="900"
      fill="white" text-anchor="middle"
      letter-spacing="1.5">FREEZE DRIED CANDY</text>
  </g>

  <!-- Candy icon left — simple wrapper shape -->
  <g transform="translate(26, 148) rotate(-25)" opacity="0.95">
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="none" stroke="white" stroke-width="2.2"/>
    <!-- left twist -->
    <line x1="-12" y1="-5" x2="-18" y2="-9" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-12" y1="0"  x2="-19" y2="0"  stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-12" y1="5"  x2="-18" y2="9"  stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <!-- right twist -->
    <line x1="12"  y1="-5" x2="18"  y2="-9" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="12"  y1="0"  x2="19"  y2="0"  stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="12"  y1="5"  x2="18"  y2="9"  stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <!-- body stripes -->
    <line x1="-5" y1="-7" x2="-5" y2="7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0"  y1="-8" x2="0"  y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5"  y1="-7" x2="5"  y2="7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Candy icon bottom-center — smaller -->
  <g transform="translate(110, 195) rotate(-10)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="10" ry="6.5" fill="none" stroke="white" stroke-width="2"/>
    <line x1="-10" y1="-4" x2="-15" y2="-7" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="0"  x2="-16" y2="0"  stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="4"  x2="-15" y2="7"  stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="10"  y1="-4" x2="15"  y2="-7" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="10"  y1="0"  x2="16"  y2="0"  stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="10"  y1="4"  x2="15"  y2="7"  stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="-4" y1="-6" x2="-4" y2="6" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0"  y1="-6.5" x2="0" y2="6.5" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="4"  y1="-6" x2="4"  y2="6" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
